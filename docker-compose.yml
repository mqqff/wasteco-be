services:
  wasteco-db:
    image: mysql:8.0
    container_name: wasteco-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-root}
      MYSQL_DATABASE: ${DB_NAME:-wasteco}
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - wasteco_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASS:-root}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - wasteco-network

  wasteco-api:
    image: wasteco-be:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wasteco-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=wasteco-db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASS=${DB_PASS:-root}
      - DB_NAME=${DB_NAME:-wasteco}
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - AUTO_MIGRATE=true
      - AUTO_SEED=true
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      wasteco-db:
        condition: service_healthy
    networks:
      - wasteco-network

volumes:
  wasteco_mysql_data:
    name: wasteco-mysql-data

networks:
  wasteco-network:
    name: wasteco-network
